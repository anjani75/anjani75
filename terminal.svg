<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
    .t  { fill: #e0e0e0; }
    .u  { fill: #00ff88; font-weight: 700; }
    .p  { fill: #00d4ff; font-weight: 700; }
    .cy { fill: #00d4ff; font-weight: 700; }
    .pk { fill: #ff006e; }
    .gr { fill: #00ff88; }
    .mu { fill: #a0a0a0; }
    .or { fill: #ff8c42; }

    .l { opacity: 0; animation: show .01s linear forwards; }
    @keyframes show { to { opacity: 1; } }
    @keyframes hide { to { opacity: 0; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

    #l1 { animation-delay: .3s; }   #l2 { animation-delay: 1.1s; }
    #l3 { animation-delay: 1.5s; }  #l4 { animation-delay: 2.8s; }
    #l5 { animation-delay: 2.95s; } #l6 { animation-delay: 3.4s; }
    #l7 { animation-delay: 4.8s; }  #l8 { animation-delay: 5.2s; }
    #l9 { animation-delay: 7.2s; }  #l10 { animation-delay: 7.35s; }
    #l11 { animation-delay: 7.8s; }

    @keyframes t1 { to { transform: translateX(54px); } }
    @keyframes t3 { to { transform: translateX(117px); } }
    @keyframes t6 { to { transform: translateX(135px); } }
    @keyframes t8 { to { transform: translateX(234px); } }
    #c1 { animation: t1 .6s steps(6) .3s forwards, hide .01s .95s forwards; }
    #c3 { animation: t3 1.1s steps(13) 1.5s forwards, hide .01s 2.65s forwards; }
    #c6 { animation: t6 1.2s steps(15) 3.4s forwards, hide .01s 4.65s forwards; }
    #c8 { animation: t8 1.8s steps(26) 5.2s forwards, hide .01s 7.05s forwards; }

    #cursor { animation: blink 1s infinite; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="818" height="398" rx="10" fill="#0a0e27" stroke="#1f2a4a" stroke-width="2"/>
  <path d="M11 1 H809 A10 10 0 0 1 819 11 V36 H1 V11 A10 10 0 0 1 11 1 Z" fill="#141a36"/>
  <line x1="1" y1="36" x2="819" y2="36" stroke="#1f2a4a" stroke-width="1"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text x="410" y="24" text-anchor="middle" class="mu" style="font-size:13px">anjani@pune: ~ — bash</text>

  <!-- 1: whoami -->
  <g id="l1" class="l">
    <text x="24" y="72" textLength="135" lengthAdjust="spacing"><tspan class="u">anjani@pune</tspan><tspan class="t">:</tspan><tspan class="p">~</tspan><tspan class="t">$ </tspan></text>
    <text x="159" y="72" class="t" textLength="54" lengthAdjust="spacing">whoami</text>
    <rect id="c1" x="159" y="56" width="66" height="22" fill="#0a0e27"/>
  </g>
  <g id="l2" class="l">
    <text x="24" y="100"><tspan class="cy">Anjani Keshri</tspan><tspan class="mu">  —  </tspan><tspan class="t">Tech Lead · DevOps / SRE / Infra @ Rahi</tspan></text>
  </g>

  <!-- 3: cat stack.txt -->
  <g id="l3" class="l">
    <text x="24" y="136" textLength="135" lengthAdjust="spacing"><tspan class="u">anjani@pune</tspan><tspan class="t">:</tspan><tspan class="p">~</tspan><tspan class="t">$ </tspan></text>
    <text x="159" y="136" class="t" textLength="117" lengthAdjust="spacing">cat stack.txt</text>
    <rect id="c3" x="159" y="120" width="129" height="22" fill="#0a0e27"/>
  </g>
  <g id="l4" class="l">
    <text x="24" y="164" class="t"><tspan class="or">infra   </tspan> Nomad · Consul · Vault · AWS · Terraform · Docker · K8s</text>
  </g>
  <g id="l5" class="l">
    <text x="24" y="192" class="t"><tspan class="or">observe </tspan> Prometheus · Grafana · OpenTelemetry · ELK · Kafka</text>
  </g>

  <!-- 6: uptime -->
  <g id="l6" class="l">
    <text x="24" y="228" textLength="135" lengthAdjust="spacing"><tspan class="u">anjani@pune</tspan><tspan class="t">:</tspan><tspan class="p">~</tspan><tspan class="t">$ </tspan></text>
    <text x="159" y="228" class="t" textLength="135" lengthAdjust="spacing">uptime --career</text>
    <rect id="c6" x="159" y="212" width="147" height="22" fill="#0a0e27"/>
  </g>
  <g id="l7" class="l">
    <text x="24" y="256" class="t">up <tspan class="pk">7+ years</tspan>,  toil <tspan class="gr">↓ 80%</tspan>,  deploys <tspan class="gr">↑ 25% faster</tspan>,  AWS SA certified</text>
  </g>

  <!-- 8: systemctl -->
  <g id="l8" class="l">
    <text x="24" y="292" textLength="135" lengthAdjust="spacing"><tspan class="u">anjani@pune</tspan><tspan class="t">:</tspan><tspan class="p">~</tspan><tspan class="t">$ </tspan></text>
    <text x="159" y="292" class="t" textLength="234" lengthAdjust="spacing">systemctl status curiosity</text>
    <rect id="c8" x="159" y="276" width="246" height="22" fill="#0a0e27"/>
  </g>
  <g id="l9" class="l">
    <text x="24" y="320" class="t"><tspan class="gr">●</tspan> curiosity.service — <tspan class="gr">active (running)</tspan> since 2019</text>
  </g>
  <g id="l10" class="l">
    <text x="24" y="348" class="mu">  └─ now: AIOps agents over MCP · self-hosted LLMs</text>
  </g>

  <!-- 11: idle prompt + cursor -->
  <g id="l11" class="l">
    <text x="24" y="380" textLength="135" lengthAdjust="spacing"><tspan class="u">anjani@pune</tspan><tspan class="t">:</tspan><tspan class="p">~</tspan><tspan class="t">$ </tspan></text>
    <rect id="cursor" x="161" y="366" width="9" height="18" fill="#00d4ff"/>
  </g>
</svg>
